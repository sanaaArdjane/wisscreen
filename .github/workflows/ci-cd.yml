name: CI/CD

# Verify every push and PR; publish to Docker Hub only when main advances.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public image repository (namespace/repo). The token lives in secrets.
  IMAGE_NAME: raouffilali19/wisscreen
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ── Quality gate: lint, types, tests, and a real production build. ──────────
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Runs after Build on purpose: `tsc` needs the route types Next generates
      # into .next/types during the build (e.g. the global `LayoutProps`).
      - name: Typecheck
        run: pnpm typecheck

  # ── Publish: build the image and push it to Docker Hub (main only). ─────────
  docker:
    name: Build & push image
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* vars get baked into the client bundle at build time (see
          # the Dockerfile) — neither is secret, so they're repo *variables*
          # (Settings → Secrets and variables → Actions → Variables), not secrets.
          # TURNSTILE_SECRET_KEY is intentionally not here: it's a runtime-only
          # value for wherever this image actually gets deployed, not the build.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # Reuse layers between runs via the GitHub Actions cache backend.
          cache-from: type=gha
          cache-to: type=gha,mode=max
